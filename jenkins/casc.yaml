jenkins:
  systemMessage: "QuickDrop CD - deploys the release branch with docker compose"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: >
      pipelineJob('quickdrop-deploy') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Yash-Singh18/ASD_MPR.git') }
                branches('*/release')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers { scm('H/2 * * * *') }
      }
