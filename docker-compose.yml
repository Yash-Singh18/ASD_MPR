name: quickdrop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickdrop}
      POSTGRES_DB: ${POSTGRES_DB:-quickdrop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickdrop} -d ${POSTGRES_DB:-quickdrop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: quickdrop-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quickdrop}:${POSTGRES_PASSWORD:-quickdrop}@db:5432/${POSTGRES_DB:-quickdrop}
      SEED_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    image: quickdrop-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
